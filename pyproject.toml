[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xva-engine"
version = "0.0.1"
description = "CVA, DVA, FVA of a netting set of EUR swaps under Hull-White 1F, validated against QuantLib"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "scipy", "pyyaml"]

[project.optional-dependencies]
test = ["pytest", "QuantLib"]
report = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
